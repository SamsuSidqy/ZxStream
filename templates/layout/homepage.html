{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZxStream - Live Streaming Platform</title>
    {% tailwind_css %}
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pureblack: '#000000',
                        purewhite: '#ffffff',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Shadows Into Light -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        /* Force Sharp Edges Everywhere */
        * { border-radius: 0px !important; }
        body {
            font-family: 'Courier Prime', cursive !important;
            font-size: 17px;
            letter-spacing: 0.01em;
            background-color: #020617; /* slate-950 */
            color: #f1f5f9;            /* slate-100 */
        }
        /* Custom Blocky Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-left: 1px solid #334155; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; }
        ::-webkit-scrollbar-corner { background: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-pureblack text-purewhite selection:bg-white selection:text-black">

    <header class="sticky top-0 z-50 bg-black border-b-2 border-white px-4 md:px-8 py-4 flex items-center justify-between">
        <!-- Logo -->
        <a href="/" class="flex items-center space-x-3">
            <h1 class="text-xl md:text-2xl font-bold tracking-tight uppercase border-2 border-white px-3 py-1 bg-white text-black">
                ZxStream
            </h1>
        </a>

        <!-- Search Bar (tampilan saja; pencarian butuh backend/JS) -->
        <div class="flex-1 max-w-xl mx-4 md:mx-12">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-black">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" placeholder="Pencarian..."
                    class="w-full bg-white text-black text-sm font-semibold pl-10 pr-4 py-2 border-2 border-white focus:outline-none placeholder-neutral-500">
            </div>
        </div>

        <!-- Profile / Action -->
        <div class="flex items-center space-x-4">
            {% if user.is_authenticated %}
            <a href="/studio" class="hidden sm:flex items-center gap-2 bg-white text-black hover:bg-neutral-200 px-4 py-2 font-bold text-sm border-2 border-white transition">
                <i class="fa-solid fa-video text-red-600"></i>
                <span>Mulai Live</span>
            </a>
            {% endif %}
            <div class="w-10 h-10 bg-white border-2 border-white flex items-center justify-center overflow-hidden cursor-pointer"
            {% if user.is_authenticated %}
            onclick="window.location.href='/studio'" 
            {% else %}
            onclick="window.location.href='/auth/login'" 
            {% endif %}
            >
                <img src="https://i0.wp.com/e-quester.com/wp-content/uploads/2021/11/placeholder-image-person-jpg.jpg?fit=820%2C678&ssl=1" alt="Profile" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <main class="flex-1 w-full mx-auto px-4 md:px-8 py-6">

    	{% block content %}

    	{% endblock %}

        
    </main>

</body>
</html>
